<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seeviin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: white;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: white;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .hero p {
            color: #aaa;
            font-size: 20px;
            margin-bottom: 35px;
        }

        .button {
            display: inline-block;
            background: white;
            color: #111;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .tools {
            padding: 60px 8%;
        }

        .tools h2 {
            text-align: center;
            margin-bottom: 35px;
            font-size: 32px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #181b23;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #292d38;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: #999;
        }

        footer {
            text-align: center;
            padding: 50px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Seeviin</div>

        <nav>
            <a href="#">Home</a>
            <a href="#tools">Tools</a>
            <a href="#">About</a>
        </nav>
    </header>

    <section class="hero">

        <h1>Seeviin</h1>

        <p>
            Simple tools. Fast results.
        </p>

        <a href="#tools" class="button">
            Explore Tools
        </a>

    </section>

    <section class="tools" id="tools">

        <h2>Tools</h2>

      <div class="grid">

    <a href="calculator.html" class="card">
        <h3>Calculator</h3>
        <p>Fast and simple calculations.</p>
    </a>

    <a href="converter.html" class="card">
    <h3>Unit Converter</h3>
    <p>Convert units quickly and easily.</p>
</a>

    <a href="percentage.html" class="card">
    <h3>Percentage</h3>
    <p>Calculate percentages instantly.</p>
</a>

    <a href="age.html" class="card">
    <h3>Age Calculator</h3>
    <p>Calculate your exact age.</p>
</a>

</div>

    </section>

    <footer>
        © 2026 Seeviin
    </footer>

</body>
</html>
