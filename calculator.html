<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - Seeviin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator {
            width: 350px;
            background: #181b23;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #292d38;
        }

        .title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        #display {
            width: 100%;
            height: 75px;
            background: #0f1117;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 32px;
            text-align: right;
            padding: 15px;
            margin-bottom: 15px;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 12px;
            background: #292d38;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #3a3f4c;
        }

        .operator {
            background: #444b5a;
        }

        .equals {
            background: white;
            color: #111;
        }

        .clear {
            background: #6b3030;
        }

        .zero {
            grid-column: span 2;
        }

        .back {
            margin-top: 20px;
            width: 100%;
            background: transparent;
            border: 1px solid #292d38;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div class="title">Seeviin Calculator</div>

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="addToDisplay('%')">%</button>
            <button class="operator" onclick="addToDisplay('/')">÷</button>

            <button onclick="addToDisplay('7')">7</button>
            <button onclick="addToDisplay('8')">8</button>
            <button onclick="addToDisplay('9')">9</button>
            <button class="operator" onclick="addToDisplay('*')">×</button>

            <button onclick="addToDisplay('4')">4</button>
            <button onclick="addToDisplay('5')">5</button>
            <button onclick="addToDisplay('6')">6</button>
            <button class="operator" onclick="addToDisplay('-')">−</button>

            <button onclick="addToDisplay('1')">1</button>
            <button onclick="addToDisplay('2')">2</button>
            <button onclick="addToDisplay('3')">3</button>
            <button class="operator" onclick="addToDisplay('+')">+</button>

            <button class="zero" onclick="addToDisplay('0')">0</button>
            <button onclick="addToDisplay('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>

        <button class="back" onclick="window.location.href='index.html'">
            ← Back to Seeviin
        </button>

    </div>

    <script>
        const display = document.getElementById("display");

        function addToDisplay(value) {
            if (display.value === "0" && value !== ".") {
                display.value = value;
            } else {
                display.value += value;
            }
        }

        function clearDisplay() {
            display.value = "0";
        }

        function deleteLast() {
            if (display.value.length > 1) {
                display.value = display.value.slice(0, -1);
            } else {
                display.value = "0";
            }
        }

        function calculate() {
            try {
                let expression = display.value.replace(/%/g, "/100");
                display.value = Function('"use strict"; return (' + expression + ')')();
            } catch {
                display.value = "Error";
            }
        }
    </script>

</body>
</html>
