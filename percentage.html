<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Percentage Calculator - Seeviin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            width: 420px;
            max-width: 100%;
            background: #181b23;
            border: 1px solid #292d38;
            border-radius: 20px;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 35px;
        }

        .question {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .inputs {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #292d38;
            background: #0f1117;
            color: white;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        .percent {
            font-size: 24px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #111;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: #0f1117;
            border-radius: 12px;
            text-align: center;
        }

        .result-label {
            color: #999;
            margin-bottom: 8px;
        }

        #result {
            font-size: 32px;
            font-weight: bold;
        }

        .back {
            background: transparent;
            color: white;
            border: 1px solid #292d38;
            font-weight: normal;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>Percentage</h1>

    <p class="subtitle">
        Calculate a percentage quickly.
    </p>

    <div class="question">
        What is
    </div>

    <div class="inputs">

        <input
            type="number"
            id="percent"
            value="0"
        >

        <div class="percent">%</div>

        <div>of</div>

        <input
            type="number"
            id="number"
            value="0"
        >

    </div>

    <button onclick="calculate()">
        Calculate
    </button>

    <div class="result">

        <div class="result-label">
            Result
        </div>

        <div id="result">
            0
        </div>

    </div>

    <button
        class="back"
        onclick="window.location.href='index.html'"
    >
        ← Back to Seeviin
    </button>

</div>


<script>

function calculate() {

    const percent =
        parseFloat(document.getElementById("percent").value);

    const number =
        parseFloat(document.getElementById("number").value);

    const result = (percent / 100) * number;

    document.getElementById("result").textContent =
        Number(result.toFixed(6)).toLocaleString();
}

</script>

</body>
</html>
